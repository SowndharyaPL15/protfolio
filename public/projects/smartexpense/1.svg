  <circle cx="200" cy="115" r="36" fill="transparent" stroke="#00b4d8" stroke-width="22" stroke-dasharray="72 155" stroke-dashoffset="-114"/>
  <circle cx="200" cy="115" r="36" fill="transparent" stroke="#2a9d8f" stroke-width="22" stroke-dasharray="41 186" stroke-dashoffset="-186"/>
  <circle cx="200" cy="115" r="15" fill="#023e8a"/>
