<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132338"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg2)"/>
  <ellipse cx="200" cy="210" rx="180" ry="30" fill="#080f1a" opacity="0.8"/>

  <!-- Medicine Bottle 1 (Front White/Amber) -->
  <rect x="90" y="60" width="85" height="135" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="100" y="42" width="65" height="22" rx="5" fill="#dedede"/>
  <rect x="95" y="90" width="75" height="75" rx="4" fill="#1e5b8a"/>
  <text x="108" y="135" font-size="28" font-weight="bold" fill="#ffffff" font-family="sans-serif">Rx</text>

  <!-- Medicine Bottle 2 (Back Brown Amber) -->
  <rect x="195" y="45" width="90" height="155" rx="16" fill="#8d5b28"/>
  <rect x="205" y="25" width="70" height="24" rx="6" fill="#5c3a19"/>
  <rect x="200" y="78" width="80" height="85" rx="4" fill="#2d6a4f" opacity="0.85"/>

  <!-- Orange Pills on Table -->
  <ellipse cx="140" cy="205" rx="18" ry="11" fill="#ff5400"/>
  <ellipse cx="172" cy="210" rx="18" ry="11" fill="#ff9e00"/>

  <!-- Large Glass Magnifying Lens Overlay -->
  <circle cx="270" cy="125" r="55" fill="none" stroke="#48cae4" stroke-width="6"/>
  <circle cx="270" cy="125" r="49" fill="#90e0ef" opacity="0.3"/>
  <line x1="310" y1="165" x2="355" y2="210" stroke="#48cae4" stroke-width="12" stroke-linecap="round"/>
</svg>
