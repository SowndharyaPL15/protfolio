<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg4)"/>
  
  <!-- Flying Quadcopter Drone -->
  <ellipse cx="200" cy="80" rx="22" ry="14" fill="#334155"/>
  <line x1="115" y1="60" x2="285" y2="100" stroke="#64748b" stroke-width="7"/>
  <line x1="115" y1="100" x2="285" y2="60" stroke="#64748b" stroke-width="7"/>
  
  <!-- Spinning Rotors -->
  <ellipse cx="110" cy="60" rx="38" ry="7" fill="#38bdf8" opacity="0.8"/>
  <ellipse cx="290" cy="60" rx="38" ry="7" fill="#38bdf8" opacity="0.8"/>
  <ellipse cx="110" cy="100" rx="38" ry="7" fill="#38bdf8" opacity="0.8"/>
  <ellipse cx="290" cy="100" rx="38" ry="7" fill="#38bdf8" opacity="0.8"/>
  
  <!-- Sensor Platform Box on right -->
  <rect x="285" y="155" width="80" height="55" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="325" cy="180" r="12" fill="#38bdf8" opacity="0.9"/>
  <path d="M 325 150 Q 315 130 295 115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 325 150 Q 335 130 355 115" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
