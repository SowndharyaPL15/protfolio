<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="poBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#poBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="250"/>
    <line x1="150" y1="0" x2="150" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="250"/>
    <line x1="250" y1="0" x2="250" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="350" y1="0" x2="350" y2="250"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>

  <!-- Grad-CAM Heatmap Focus Region (Bio-Imaging Simulation) -->
  <circle cx="200" cy="120" r="75" fill="url(#heatGlow)"/>

  <!-- Histopathology Cell Structures -->
  <g fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8">
    <!-- Center Target Cell -->
    <circle cx="200" cy="120" r="38" stroke="#38bdf8" stroke-dasharray="4,3" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="200" cy="120" r="16" fill="#0284c7" opacity="0.4"/>
    <circle cx="200" cy="120" r="6" fill="#f8fafc"/>

    <!-- Surrounding Cells & Neural Nodes -->
    <circle cx="140" cy="85" r="18" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <circle cx="260" cy="85" r="22" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <circle cx="145" cy="165" r="20" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
    <circle cx="255" cy="160" r="16" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Neural / Multimodal Connection Lines -->
    <line x1="140" y1="85" x2="185" y2="110" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="260" y1="85" x2="215" y2="110" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="145" y1="165" x2="188" y2="132" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <line x1="255" y1="160" x2="212" y2="132" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Crosshair Reticle (Clinical Diagnostics Focus) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <line x1="200" y1="50" x2="200" y2="70"/>
    <line x1="200" y1="170" x2="200" y2="190"/>
    <line x1="130" y1="120" x2="150" y2="120"/>
    <line x1="250" y1="120" x2="270" y2="120"/>
    
    <!-- Corner brackets -->
    <path d="M 120 55 L 105 55 L 105 70" fill="none" opacity="0.8"/>
    <path d="M 280 55 L 295 55 L 295 70" fill="none" opacity="0.8"/>
    <path d="M 120 185 L 105 185 L 105 170" fill="none" opacity="0.8"/>
    <path d="M 280 185 L 295 185 L 295 170" fill="none" opacity="0.8"/>
  </g>

  <!-- Medical Cross Badge -->
  <g transform="translate(45, 35)">
    <rect width="28" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 14 8 L 14 20 M 8 14 L 20 14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- AI Grad-CAM Confidence Tag -->
  <g transform="translate(290, 35)">
    <rect width="65" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="16" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">97.8%</text>
  </g>
</svg>
